name: Pull Request Validator

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR description is filled in
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const stripped = body
              .replace(/<!--[\s\S]*?-->/g, '')
              .replace(/^\s*#{1,6}\s.*$/gm, '')
              .replace(/^\s*[-*]\s*(\[[ xX]\].*)?$/gm, '')
              .replace(/^\s*Closes #\s*$/gm, '')
              .trim();

            if (stripped.length < 30) {
              core.setFailed(
                'PR description is too short or only contains the template placeholders. ' +
                'Please fill in the Description and Changes Made sections.'
              );
            }