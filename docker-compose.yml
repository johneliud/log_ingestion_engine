version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: log_ingestion_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: log_engine
      RABBITMQ_DEFAULT_PASS: log_engine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
