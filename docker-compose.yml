version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: log_ingestion_rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:?set RABBITMQ_USER in .env or the environment}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS:?set RABBITMQ_PASS in .env or the environment}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
