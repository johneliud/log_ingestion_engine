<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log ingestion engine dashboard</title>
    <link rel="stylesheet" href="/dashboard/css/styles.css">
    <script src="/dashboard/js/chart.umd.js"></script>
    <script src="/dashboard/js/app.js" defer></script>
</head>
<body class="min-h-screen bg-white text-slate-900">
    <main class="mx-auto max-w-6xl space-y-6 p-6">
        <header class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-200 pb-4">
            <div class="flex flex-wrap items-center gap-6">
                <h1 class="text-2xl font-semibold">Log ingestion engine</h1>
                <nav class="flex gap-4 text-sm">
                    <a href="/" class="text-slate-500 hover:text-slate-900">Home</a>
                    <a href="/dashboard" class="font-medium text-slate-900">Dashboard</a>
                    <a href="/metrics" class="text-slate-500 hover:text-slate-900">Metrics</a>
                </nav>
            </div>
            <p id="last-refreshed" class="text-sm text-slate-500">waiting for the first snapshot</p>
        </header>

        <section class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
            <article class="rounded-xl bg-slate-50 p-4">
                <h2 class="text-sm text-slate-500">Total logs received</h2>
                <p id="total-logs-received" class="mt-1 text-3xl font-bold">&mdash;</p>
            </article>
            <article class="rounded-xl bg-slate-50 p-4">
                <h2 class="text-sm text-slate-500">Logs per second</h2>
                <p id="logs-per-second" class="mt-1 text-3xl font-bold">&mdash;</p>
            </article>
            <article class="rounded-xl bg-slate-50 p-4">
                <h2 class="text-sm text-slate-500">Error rate</h2>
                <p id="error-rate" class="mt-1 text-3xl font-bold">&mdash;</p>
            </article>
            <article class="rounded-xl bg-slate-50 p-4">
                <h2 class="text-sm text-slate-500">Queue backlog</h2>
                <p id="queue-backlog" class="mt-1 text-3xl font-bold">&mdash;</p>
            </article>
        </section>

        <section class="grid grid-cols-1 gap-4 lg:grid-cols-2">
            <article class="rounded-xl bg-slate-50 p-4">
                <h2 class="text-sm text-slate-500">Logs per second over time</h2>
                <canvas id="throughput-chart" class="mt-2 h-64 w-full"></canvas>
            </article>
            <article class="rounded-xl bg-slate-50 p-4">
                <h2 class="text-sm text-slate-500">Error rate over time</h2>
                <canvas id="error-rate-chart" class="mt-2 h-64 w-full"></canvas>
            </article>
            <article class="rounded-xl bg-slate-50 p-4 lg:col-span-2">
                <h2 class="text-sm text-slate-500">Top five services by volume</h2>
                <canvas id="top-services-chart" class="mt-2 h-64 w-full"></canvas>
                <table class="mt-4 w-full text-left text-sm">
                    <thead>
                        <tr class="text-slate-500">
                            <th class="py-1">Service</th>
                            <th class="py-1 text-right">Logs received</th>
                        </tr>
                    </thead>
                    <tbody id="top-services-table">
                        <tr>
                            <td class="py-1">waiting for the first snapshot</td>
                            <td class="py-1 text-right">&mdash;</td>
                        </tr>
                    </tbody>
                </table>
            </article>
        </section>
    </main>
</body>
</html>
